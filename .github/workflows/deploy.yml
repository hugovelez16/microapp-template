name: CD Build y Deploy Produccion (Komodo)

on:
  push:
    branches:
      - main
  workflow_dispatch: {}

env:
  REGISTRY: ghcr.io
  IMAGE_BASE: ghcr.io/${{ github.repository }}

jobs:
  get-version:
    name: Obtener Version SemVer
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.versioning.outputs.version }}
    steps:
      - name: Checkout Repositorio
        uses: actions/checkout@v4

      - name: Leer Version SemVer
        id: versioning
        run: |
          VERSION=$(grep '"version"' package.json | head -1 | cut -d'"' -f4)
          echo "Version detectada: ${VERSION}"
          echo "version=${VERSION}" >> $GITHUB_OUTPUT

  build:
    name: Compilar y Publicar ${{ matrix.image }}
    needs: [get-version]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - image: app
            target: runner
          - image: tools
            target: tools
    steps:
      - name: Checkout Repositorio
        uses: actions/checkout@v4

      - name: Iniciar Sesion en GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compilar y Publicar Imagen
        uses: docker/build-push-action@v5
        with:
          context: .
          target: ${{ matrix.target }}
          push: true
          build-args: |
            APP_VERSION=${{ needs.get-version.outputs.version }}
          tags: |
            ${{ env.IMAGE_BASE }}/${{ matrix.image }}:latest
            ${{ env.IMAGE_BASE }}/${{ matrix.image }}:v${{ needs.get-version.outputs.version }}

  deploy-komodo:
    name: Desplegar Stack en Komodo
    needs: [get-version, build]
    runs-on: ubuntu-latest
    steps:
      - name: Disparar Webhook Komodo
        env:
          KOMODO_WEBHOOK: ${{ secrets.KOMODO_WEBHOOK }}
          KOMODO_SECRET: ${{ secrets.KOMODO_SECRET }}
        run: |
          if [ -z "$KOMODO_WEBHOOK" ]; then
            echo "Error: secreto KOMODO_WEBHOOK no configurado en el repositorio." >&2
            exit 1
          fi

          # Komodo valida la rama a partir de "ref"; sin ese campo descarta el webhook en silencio.
          BODY="{\"ref\":\"${GITHUB_REF}\"}"
          if [ -n "$KOMODO_SECRET" ]; then
            SIGNATURE="sha256=$(printf '%s' "$BODY" | openssl dgst -sha256 -hmac "$KOMODO_SECRET" | sed 's/^.* //')"
            curl -f -s -X POST "$KOMODO_WEBHOOK" \
              -H "Content-Type: application/json" \
              -H "X-Hub-Signature-256: $SIGNATURE" \
              -d "$BODY"
          else
            curl -f -s -X POST "$KOMODO_WEBHOOK" \
              -H "Content-Type: application/json" \
              -d "$BODY"
          fi
          echo "Despliegue en Komodo disparado."
