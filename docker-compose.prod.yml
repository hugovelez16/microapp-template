name: ${COMPOSE_PROJECT_NAME:-microapp}

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "20m"
    max-file: "5"

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    logging: *default-logging
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-app}
    volumes:
      - postgres_data:/var/lib/postgresql/data:z
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-app} -d ${POSTGRES_DB:-app}"]
      interval: 5s
      timeout: 3s
      retries: 5

  migrate:
    image: ghcr.io/${GITHUB_REPOSITORY:-hugovelez16/microapp-template}/tools:${IMAGE_TAG:-latest}
    restart: "no"
    logging: *default-logging
    command: ["npm", "run", "db:migrate"]
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env

  app:
    image: ghcr.io/${GITHUB_REPOSITORY:-hugovelez16/microapp-template}/app:${IMAGE_TAG:-latest}
    restart: unless-stopped
    logging: *default-logging
    depends_on:
      migrate:
        condition: service_completed_successfully
    env_file:
      - .env
    ports:
      - "${APP_PORT:-3000}:3000"

volumes:
  postgres_data:
